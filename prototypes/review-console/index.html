      <div class="workspace"><span class="avatar">羊</span><div><strong>羊羊的学习空间</strong><small>一名学习者 · 一个管理者</small></div></div>
      <p class="nav-caption">工作台</p>
      <nav aria-label="主导航">
        <a href="#calendar" data-page="calendar"><span class="nav-icon">▦</span>学习与复习<span class="nav-index">01</span></a>
        <a href="#memory" data-page="memory"><span class="nav-icon">▤</span>Agent 记忆<span class="nav-index">02</span></a>
        <a href="#identity" data-page="identity"><span class="nav-icon">◎</span>人员与身份<span class="nav-index">03</span></a>
        <a href="#data" data-page="data"><span class="nav-icon">⇄</span>迁移数据核对<span class="nav-index">04</span></a>

      <div class="sidebar-note"><span class="orbit">◌</span><p>把学过的，<br>慢慢变成记得的。</p><small>拍照上传 → 记忆计算 → 背诵复习</small></div>
      <div class="admin"><span class="avatar small">管</span><div><strong>管理者</strong><small>全部数据查看权限</small></div><span class="admin-dot"></span></div>
    </aside>
    <div class="main-shell">
      <header class="topbar"><span id="breadcrumb">工作台 / 学习与复习</span><div><span class="local-indicator">本地样板</span><span class="header-separator"></span><span class="date-label">2026 年 10 月 4 日</span></div></header>
      <main id="main" tabindex="-1"><div class="loading">正在读取本机数据副本…</div></main>
      <footer><span>333 · 羊羊的记忆工作台</span><span id="footer-source">本机数据副本 · 线上服务保持运行</span></footer>
    </div>
  </div>
  <dialog id="detail" class="detail"><div class="detail-top"><span id="drawer-label"></span><button class="icon-button" id="close-detail" aria-label="关闭详情">×</button></div><div id="detail-content"></div></dialog>
  <dialog id="upload-dialog" class="upload-dialog"><form id="upload-form"><div class="detail-top"><span>模拟一次群内上传</span><button class="icon-button" type="button" data-close-upload aria-label="关闭上传">×</button></div><h2>今天想记住什么？</h2><p class="muted">演示羊羊在群里上传后的整理方式。此操作仅进入示例数据。</p><label>知识点或记录标题<input name="title" required maxlength="100" placeholder="例如：教育目的的价值取向"></label><label>这次上传属于<select name="kind"><option value="learn">今天刚学习</option><option value="forgotten">今天发现遗忘</option><option value="record">记录一件事</option></select></label><label>内容摘要<textarea name="text" rows="4" placeholder="照片转写或需要提醒的内容"></textarea></label><button class="button primary" type="submit">加入示例，查看安排 <span>↗</span></button><p class="form-note">真实图片入口仍是飞书群；本地 demo 不发送消息。</p></form></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
