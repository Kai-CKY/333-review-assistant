services:
  app:
    image: ${REVIEW_APP_IMAGE:-333-review-assistant-app:latest}
    build:
      context: .
      args:
        APP_REVISION: ${APP_REVISION:-unknown}
    restart: unless-stopped
    init: true
    env_file:
      - .env.local
    environment:
      PORT: "3333"
      HOST: 0.0.0.0
      DATA_FILE: /data/review-assistant.sqlite
      DATA_FORMAT: relational-v1
    # Do not make the unauthenticated API public. Access it through an SSH
    # tunnel until application-level authentication is implemented.
    ports:
      - "127.0.0.1:3333:3333"
    volumes:
      - ./runtime-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('node:http').get('http://127.0.0.1:3333/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
