name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build deployment image
        run: docker build --tag 333-review-assistant:ci .

  pdf-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Build pinned CPU parser
        run: docker build -f apps/pdf-parser/Dockerfile -t 333-pdf-parser:ci .
      - name: Parser normalization and input limits
        run: docker run --rm -v "$PWD/apps/pdf-parser/test_worker.py:/worker/test_worker.py:ro" 333-pdf-parser:ci python -m unittest test_worker
      - name: Real text and scanned PDF smoke test
        run: docker run --rm -e MINERU_MODEL_SOURCE=huggingface 333-pdf-parser:ci python smoke.py
