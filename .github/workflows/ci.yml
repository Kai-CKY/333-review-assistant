name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check retrieval regression
        run: npm run knowledge:evaluate -- --scale 1000

      - name: Build deployment image
        run: docker build --build-arg APP_REVISION="${GITHUB_SHA}" --tag 333-review-assistant:ci .

      - name: Smoke test deployment image with JSON and SQLite
        run: >-
          docker run --rm
          --mount "type=bind,source=$PWD/scripts,target=/app/scripts,readonly"
          333-review-assistant:ci node scripts/smoke-deployment.mjs
